name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain in rust-toolchain.toml drives clippy. rustfmt runs
      # on nightly because group_imports and imports_granularity — the two
      # options that actually enforce import ordering — are nightly-only. On
      # stable they are silently ignored, so a stable fmt check would pass code
      # the config is meant to reject.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo +nightly fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The library must stay usable in the browser, so it is built for wasm
      # on every commit rather than discovered to be broken at release time.
      - name: build library for wasm
        run: cargo build -p casimir --target wasm32-unknown-unknown --no-default-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches broken intra-doc links before they reach docs.rs, where a
      # published version cannot be corrected.
      - name: rustdoc
        run: cargo doc -p casimir --no-deps
